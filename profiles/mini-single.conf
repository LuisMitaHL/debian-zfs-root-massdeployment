# mini-single.conf — single-SSD mini PC
#
# Sourced by scripts/zfs-stamp.sh. See profiles/README.md for the schema.
# Disk paths MUST be /dev/disk/by-id/* — replace the placeholders below.

PROFILE_NAME="mini-single"
CLASS="mini"
HOSTNAME="mini01"

DISKS=(
  /dev/disk/by-id/REPLACE-ME-ata-EXAMPLE
)

TOPOLOGY="single"
BOOT_MODE="uefi"

# Mini PCs: encrypted swap with an ephemeral per-boot key, plus zswap in front of it.
SWAP="ephemeral"
SWAP_SIZE="4G"
ZSWAP="yes"
ZRAM="no"

# LUKS2 under ZFS on every class.
CRYPT="yes"

ADDRESS="dhcp"

# Serial console. Empty/absent = VGA only. Mini PCs usually have a monitor, but a serial
# console is also what lets an automated test observe the boot (and the LUKS prompt).
#SERIAL_CONSOLE="ttyS0,115200"

# Remote unlock (dropbear in the initramfs): public key file the initramfs accepts.
# Without this, LUKS unlock is console/serial only.
#DROPBEAR_AUTHORIZED_KEYS="/media/carrier/authorized_keys"

# Unattended provisioning only: passphrase file for non-interactive luksFormat/open.
# Without it, cryptsetup prompts once per disk. Never leave it on the carrier.
#LUKS_KEYFILE="/media/carrier/luks.key"

# Optional login user with sudo (empty = root-only). Needs sudo in the golden image.
#USERNAME="operator"
# Password hash, NOT plaintext — generate with: openssl passwd -6
# Single quotes matter: the hash contains $ characters.
#USER_PASSWORD_HASH='$6$...'
#USER_AUTHORIZED_KEYS="/media/carrier/authorized_keys"
