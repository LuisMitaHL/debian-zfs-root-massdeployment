# server-mirror.conf — two-disk mirror server
#
# Sourced by scripts/zfs-stamp.sh. See profiles/README.md for the schema.
# Disk paths MUST be /dev/disk/by-id/* — replace the placeholders below.

PROFILE_NAME="server-mirror"
CLASS="server"
HOSTNAME="srv01"

DISKS=(
  /dev/disk/by-id/REPLACE-ME-ata-EXAMPLE-A
  /dev/disk/by-id/REPLACE-ME-ata-EXAMPLE-B
)

TOPOLOGY="mirror"
BOOT_MODE="both"          # UEFI first-class, legacy BIOS also supported

# Servers: zram only, no disk swap at all.
SWAP="none"
ZRAM="yes"
ZRAM_SIZE="ram / 2"    # an expression in MiB, NOT a percentage — see profiles/README.md

CRYPT="yes"

# Headless server: put GRUB, the kernel log and the LUKS prompt on the serial port.
SERIAL_CONSOLE="ttyS0,115200"

ADDRESS="static"
IPV4="192.0.2.10"
CIDR="24"
GATEWAY="192.0.2.1"
DNS="192.0.2.53"
