# server-raidz2.conf — six-disk raidz2 server
#
# Sourced by scripts/zfs-stamp.sh. See profiles/README.md for the schema.
# Disk paths MUST be /dev/disk/by-id/* — replace the placeholders below.

PROFILE_NAME="server-raidz2"
CLASS="server"
HOSTNAME="srv02"

DISKS=(
  /dev/disk/by-id/REPLACE-ME-ata-EXAMPLE-1
  /dev/disk/by-id/REPLACE-ME-ata-EXAMPLE-2
  /dev/disk/by-id/REPLACE-ME-ata-EXAMPLE-3
  /dev/disk/by-id/REPLACE-ME-ata-EXAMPLE-4
  /dev/disk/by-id/REPLACE-ME-ata-EXAMPLE-5
  /dev/disk/by-id/REPLACE-ME-ata-EXAMPLE-6
)

TOPOLOGY="raidz2"
BOOT_MODE="both"

# Servers: zram only, no disk swap at all.
SWAP="none"
ZRAM="yes"
ZRAM_SIZE="ram / 2"    # an expression in MiB, NOT a percentage — see profiles/README.md

CRYPT="yes"

# Headless server: put GRUB, the kernel log and the LUKS prompt on the serial port.
SERIAL_CONSOLE="ttyS0,115200"

ADDRESS="static"
IPV4="192.0.2.11"
CIDR="24"
GATEWAY="192.0.2.1"
DNS="192.0.2.53"
